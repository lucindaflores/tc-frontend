<div class="stepper">
  <button type="button"
          class="stepper-button"
          (click)="decrease()"
          [disabled]="quantity() === 1">
    −
  </button>

  <span class="stepper-value">{{ quantity() }}</span>

  <button type="button"
          class="stepper-button"
          (click)="increase()"
          [disabled]="quantity() === max()">
    +
  </button>
</div>
